<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f0ede6;
      --surface: #ece9e2;
      --border:  #d8d4ca;
      --text:    #1a1a1a;
      --muted:   #6b6860;
      --accent:  #2596be;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 480px;
      animation: fadeUp 0.7s ease both;
    }

    .divider {
      width: 40px;
      height: 1.5px;
      background: var(--accent);
      margin: 0 auto 2rem;
      opacity: 0.7;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    h1 em {
      color: var(--accent);
      font-style: italic;
    }

    p {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.75;
      letter-spacing: 0.01em;
    }

    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      border-top: 1px solid var(--border);
      padding: 1.2rem 2rem;
      text-align: center;
    }

    footer p {
      font-size: 0.75rem;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="divider"></div>
    <h1>Under <em>Maintenance.</em></h1>
    <p>The website is currently under maintenance.<br>Please come back later.</p>
  </div>

  <footer>
    <p>© 2026 Yuki Wang. All rights reserved.</p>
  </footer>

</body>
</html>
